<svg width="680" height="116" viewBox="0 0 680 116" xmlns="http://www.w3.org/2000/svg">
  <style><![CDATA[
    .line    { font-family: 'Noto Sans Tamil', 'Nirmala UI', 'Tamil Sangam MN', sans-serif; font-size: 17px; fill: #C9D1D9; }
    .meaning { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #8B949E; }
    .tag     { font-family: 'Noto Sans Tamil', 'Nirmala UI', 'Tamil Sangam MN', sans-serif; font-size: 12px; fill: #58A6FF; }
  ]]></style>

  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">அகர முதல எழுத்தெல்லாம் ஆதி</text>
    <text class="line" x="340" y="52" text-anchor="middle">பகவன் முதற்றே உலகு</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Just as ‘A’ begins every letter, the world begins with the Primal God.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 1 · கடவுள் வாழ்த்து</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0080;0.0920;0.1000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">கற்க கசடறக் கற்பவை கற்றபின்</text>
    <text class="line" x="340" y="52" text-anchor="middle">நிற்க அதற்குத் தக</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Learn thoroughly whatever you learn — then live up to what you learned.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 391 · கல்வி</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1080;0.1920;0.2000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">தொட்டனைத் தூறும் மணற்கேணி மாந்தர்க்குக்</text>
    <text class="line" x="340" y="52" text-anchor="middle">கற்றனைத் தூறும் அறிவு</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">As a sand-well yields more water the deeper you dig, learning deepens wisdom.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 396 · கல்வி</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2080;0.2920;0.3000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">அன்பிலார் எல்லாம் தமக்குரியர் அன்புடையார்</text>
    <text class="line" x="340" y="52" text-anchor="middle">என்பும் உரியர் பிறர்க்கு</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">The loveless keep everything for themselves; the loving give even their bones for others.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 72 · அன்புடைமை</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3080;0.3920;0.4000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">உடுக்கை இழந்தவன் கைபோல ஆங்கே</text>
    <text class="line" x="340" y="52" text-anchor="middle">இடுக்கண் களைவதாம் நட்பு</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Like a hand rushing to catch a slipping garment, true friendship rushes to ease distress.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 786 · நட்பு</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4080;0.4920;0.5000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">தெய்வத்தான் ஆகா தெனினும் முயற்சிதன்</text>
    <text class="line" x="340" y="52" text-anchor="middle">மெய்வருத்தக் கூலி தரும்</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Even without divine help, honest effort brings its own reward.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 619 · ஆள்வினையுடைமை</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5080;0.5920;0.6000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">கேடில் விழுச்செல்வம் கல்வி ஒருவற்கு</text>
    <text class="line" x="340" y="52" text-anchor="middle">மாடல்ல மற்றை யவை</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Education is the one wealth that never perishes; nothing else compares.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 400 · கல்வி</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6080;0.6920;0.7000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">இன்னா செய்தாரை ஒறுத்தல் அவர்நாண</text>
    <text class="line" x="340" y="52" text-anchor="middle">நன்னயம் செய்து விடல்</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">The best way to punish a wrongdoer is to shame them with an act of kindness.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 314 · இன்னா செய்யாமை</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7080;0.7920;0.8000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">எண்ணிய எண்ணியாங்கு எய்துப எண்ணியார்</text>
    <text class="line" x="340" y="52" text-anchor="middle">திண்ணியர் ஆகப் பெறின்</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Those who think with firm resolve achieve exactly what they set their mind on.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 666 · வினைத்திட்பம்</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8080;0.8920;0.9000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="0">
    <text class="line" x="340" y="30" text-anchor="middle">பிறவிப் பெருங்கடல் நீந்துவர் நீந்தார்</text>
    <text class="line" x="340" y="52" text-anchor="middle">இறைவன் அடிசேரா தார்</text>
    <text class="meaning" x="340" y="76" text-anchor="middle">Those who hold to God’s feet cross the vast ocean of rebirth; others do not.</text>
    <text class="tag"  x="340" y="100" text-anchor="middle">குறள் 10 · கடவுள் வாழ்த்து</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9000;0.9080;0.9920;1.0000;1" dur="70s" repeatCount="indefinite" begin="0s"/>
  </g>
</svg>
